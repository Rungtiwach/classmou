<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แปลงสกุลเงิน</title>
    <link rel="stylesheet" href="/css/monney.css">
</head>
<body>
     <div class="card">
    <h2>ตัวแปลงสกุลเงิน</h2>

    <label for="amount">จำนวนเงิน</label>
    <input id="amount" type="number" value="100" min="0">

    <div class="row">
        <select id="from">
        <option selected>USD</option><option>EUR</option>
        <option>JPY</option><option>CNY</option><option>THB</option>
        </select>
        <button id="swap" title="สลับสกุลเงิน">⇄</button>
        <select id="to">
        <option selected>THB</option><option>USD</option>
        <option>EUR</option><option>JPY</option><option>CNY</option>
        </select>
    </div>

    <button id="convert" class="primary">แปลงค่า</button>
    <p id="result" class="result">-</p>
    <small id="info"></small>
    </div>
    <script src="/js/monney.js"></script>
</body>
</html>
